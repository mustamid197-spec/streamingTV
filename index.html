<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KusoTV | Live Sports Streaming HD</title>
    
    <!-- ====== SEO META TAGS ====== -->
    <meta name="description" content="Nonton live sports streaming HD gratis tanpa langganan. Sepak bola Liga Champions, Liga Spanyol, Liga Inggris, dan olahraga dunia lainnya di KusoTV.">
    <meta name="keywords" content="live sports streaming, nonton bola online, live football hd, Liga Champions live, Liga Spanyol stream, kusotv">
    <meta name="robots" content="index, follow">
    <meta name="author" content="KusoTV">

    <!-- ====== OPEN GRAPH ====== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="KusoTV | Live Sports Streaming HD">
    <meta property="og:description" content="Nonton siaran langsung olahraga gratis kualitas HD di KusoTV.">
    <meta property="og:image" content="images/index.png">

    <!-- ====== FAVICON / TAB ICON ====== -->
    <link rel="icon" type="image/png" sizes="192x192" href="images/favicon.png">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="shortcut icon" type="image/png" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Config -->
    <script src="js/config.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 1. Header (Logo & Dark Themes Toggle) -->
        <header class="app-header">
            <div class="logo-container">
                <a href="/" class="logo-link" title="KusoTV Home">
                    <div class="brand-logo-custom">
                        <span class="l-k">K</span><span class="l-u">U</span><span class="l-s">S</span><span class="l-o">O</span><span class="l-t">T</span><span class="l-v">V</span>
                    </div>
                </a>
            </div>
            
            <div class="theme-toggle-wrapper" id="theme-toggle" title="Ganti Tema (Light / Dark)">
                <span class="theme-label">dark themes</span>
                <div class="toggle-switch">
                    <span class="toggle-thumb"></span>
                </div>
            </div>
        </header>

        <!-- 2. Video Player Section (16:9 Aspect Ratio) -->
        <section class="player-section" id="player-section">
            <div class="player-wrapper" id="player-wrapper">
                <!-- Video Placeholder Banner -->
                <div class="player-placeholder" id="player-placeholder" title="Klik untuk memutar siaran">
                    <img src="images/index.png" alt="KusoTV Live Sports" id="placeholder-img">
                    <div class="placeholder-overlay">
                        <div class="play-pulse-btn">
                            <i class="fas fa-play"></i>
                        </div>
                        <p class="placeholder-text">Klik salah satu pertandingan di bawah untuk menonton siaran</p>
                    </div>
                </div>

                <!-- Video Iframe Player -->
                <iframe 
                    id="video-iframe" 
                    src="about:blank" 
                    frameborder="0" 
                    allowfullscreen 
                    scrolling="no" 
                    allow="autoplay; encrypted-media; picture-in-picture"
                    style="display: none;"
                ></iframe>

                <!-- Match Countdown / Upcoming Screen (Timestamps Menuju Jadwal) -->
                <div class="player-countdown-screen" id="player-countdown-screen" style="display: none;">
                    <div class="countdown-screen-bg"></div>
                    <div class="countdown-screen-content">
                        <!-- Top League & Kickoff Meta -->
                        <div class="countdown-top-meta">
                            <span class="countdown-league-badge" id="cd-league">
                                <i class="fas fa-trophy" style="color: #eab308;"></i> <span id="cd-league-text">Liga</span>
                            </span>
                            <span class="countdown-kickoff-time" id="cd-kickoff-text">
                                <i class="far fa-clock"></i> Pukul 19.30 WIB
                            </span>
                        </div>

                        <!-- Matchup Teams -->
                        <div class="countdown-matchup">
                            <div class="countdown-team-box team-home">
                                <img id="cd-team1-logo" src="images/sportsicon/Soccer.png" class="cd-team-logo" alt="" onerror="this.onerror=null; this.src='images/sportsicon/Soccer.png'">
                                <span class="cd-team-name" id="cd-team1-name">Tim 1</span>
                            </div>
                            <div class="countdown-vs-badge">VS</div>
                            <div class="countdown-team-box team-away">
                                <img id="cd-team2-logo" src="images/sportsicon/Soccer.png" class="cd-team-logo" alt="" onerror="this.onerror=null; this.src='images/sportsicon/Soccer.png'">
                                <span class="cd-team-name" id="cd-team2-name">Tim 2</span>
                            </div>
                        </div>

                        <!-- Countdown Timer Grid -->
                        <div class="countdown-timer-section">
                            <div class="countdown-timer-title">
                                <i class="fas fa-hourglass-half"></i> SIARAN DIMULAI DALAM
                            </div>
                            <div class="countdown-timer-grid">
                                <div class="cd-time-unit">
                                    <strong id="cd-days">00</strong>
                                    <span>HARI</span>
                                </div>
                                <div class="cd-colon">:</div>
                                <div class="cd-time-unit">
                                    <strong id="cd-hours">00</strong>
                                    <span>JAM</span>
                                </div>
                                <div class="cd-colon">:</div>
                                <div class="cd-time-unit">
                                    <strong id="cd-minutes">00</strong>
                                    <span>MENIT</span>
                                </div>
                                <div class="cd-colon">:</div>
                                <div class="cd-time-unit cd-unit-seconds">
                                    <strong id="cd-seconds">00</strong>
                                    <span>DETIK</span>
                                </div>
                            </div>
                            <div class="countdown-notice">
                                <i class="fas fa-satellite-dish"></i> Siaran langsung akan tayang otomatis saat kick-off
                            </div>
                        </div>

                        <!-- Action Bar inside countdown screen -->
                        <div class="countdown-action-bar">
                            <button class="cd-btn-preview" id="cd-btn-preview" title="Tonton siaran saluran sekarang">
                                <i class="fas fa-tv"></i> Tonton Saluran Live Preview
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Now Playing & Server Switch Bar -->
            <div class="now-playing-bar" id="now-playing-bar" style="display: none;">
                <div class="now-playing-info">
                    <span class="live-dot" id="live-indicator-dot"></span>
                    <span class="countdown-dot" id="cd-indicator-dot" style="display: none;"><i class="fas fa-stopwatch" style="color: #38bdf8;"></i></span>
                    <span class="playing-title" id="playing-title">Memutar Siaran Live</span>
                </div>
                <div class="now-playing-actions">
                    <button class="now-playing-toggle-btn" id="toggle-screen-btn" style="display: none;">
                        <i class="fas fa-hourglass-half"></i> Hitung Mundur
                    </button>
                </div>
                <div class="server-chips" id="server-chips">
                    <!-- Dynamic server buttons inserted here -->
                </div>
            </div>
        </section>

        <!-- 3. Sports Category Filter Bar (Liga-Liga Besar) -->
        <div class="category-scroll-container">
            <button class="category-freeze" id="btn-live-event" data-category="live">
                <i class="fas fa-circle live-indicator"></i> Live Event
            </button>
            <button class="category-arrow-btn arrow-left" id="cat-arrow-left" aria-label="Scroll Kiri">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="category-scroll-wrapper" id="category-scroll-wrapper">
                <div class="category-buttons-container" id="category-buttons">
                    <button class="category-button active" data-category="all">
                        <i class="fas fa-th-large" style="color: #64748b;"></i> Semua
                    </button>
                    <button class="category-button" data-category="hot">
                        <i class="fas fa-fire" style="color: #f97316;"></i> Hot Event
                    </button>
                    <button class="category-button" data-category="Indo">
                        <i class="fas fa-futbol" style="color: #ef4444;"></i> Liga Indonesia
                    </button>
                    <button class="category-button" data-category="Inggris">
                        <i class="fas fa-futbol" style="color: #8b5cf6;"></i> Liga Inggris
                    </button>
                    <button class="category-button" data-category="Italia">
                        <i class="fas fa-futbol" style="color: #0284c7;"></i> Liga Italia
                    </button>
                    <button class="category-button" data-category="Spanyol">
                        <i class="fas fa-futbol" style="color: #f59e0b;"></i> Liga Spanyol
                    </button>
                    <button class="category-button" data-category="Jerman">
                        <i class="fas fa-futbol" style="color: #dc2626;"></i> Liga Jerman
                    </button>
                    <button class="category-button" data-category="Perancis">
                        <i class="fas fa-futbol" style="color: #2563eb;"></i> Liga Perancis
                    </button>
                    <button class="category-button" data-category="Belanda">
                        <i class="fas fa-futbol" style="color: #ea580c;"></i> Liga Belanda
                    </button>
                    <button class="category-button" data-category="Portugal">
                        <i class="fas fa-futbol" style="color: #16a34a;"></i> Liga Portugal
                    </button>
                    <button class="category-button" data-category="UCL">
                        <i class="fas fa-trophy" style="color: #eab308;"></i> Liga Champions
                    </button>
                    <button class="category-button" data-category="Championship">
                        <i class="fas fa-shield-alt" style="color: #10b981;"></i> Championship
                    </button>
                    <button class="category-button" data-category="Konferensi">
                        <i class="fas fa-globe-europe" style="color: #06b6d4;"></i> Conference League
                    </button>
                    <button class="category-button" data-category="AFF">
                        <i class="fas fa-flag" style="color: #e11d48;"></i> AFF League
                    </button>
                </div>
            </div>
            <button class="category-arrow-btn arrow-right" id="cat-arrow-right" aria-label="Scroll Kanan">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <!-- 4. Filter Navigation Tabs (Exact PDF Colors) -->
        <nav class="filter-tabs-nav" aria-label="Jadwal Navigasi">
            <div class="filter-tabs-left">
                <button class="filter-btn btn-tomorrow" data-tab="tomorrow">
                    Pertandingan besok
                </button>
                <button class="filter-btn btn-today active" data-tab="today">
                    Pertandingan hari ini
                </button>
                <button class="filter-btn btn-yesterday" data-tab="yesterday">
                    Pertandingan kemarin
                </button>
            </div>
            <div class="filter-tabs-right">
                <button class="filter-btn btn-all" data-tab="all">
                    Jadwal pertandingan
                </button>
            </div>
        </nav>

        <!-- 4. Match Fixtures List -->
        <main class="matches-container" id="matches-container">
            <div class="matches-loading">
                <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> Memuat jadwal pertandingan...
            </div>
        </main>
    </div>

    <!-- Security Protection (Anti Right-Click & Anti Inspect) -->
    <script src="js/security.js"></script>

    <!-- Application Controller -->
    <script src="js/app.js"></script>
</body>
</html>
