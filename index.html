<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KusoTV | Live Sports Streaming HD</title>
    
    <!-- ====== SEO META TAGS ====== -->
    <meta name="description" content="Nonton live sports streaming HD gratis tanpa langganan. Sepak bola Liga Champions, Liga Spanyol, Liga Inggris, dan olahraga dunia lainnya di KusoTV.">
    <meta name="keywords" content="live sports streaming, nonton bola online, live football hd, Liga Champions live, Liga Spanyol stream, kusotv">
    <meta name="robots" content="index, follow">
    <meta name="author" content="KusoTV">

    <!-- ====== OPEN GRAPH ====== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="KusoTV | Live Sports Streaming HD">
    <meta property="og:description" content="Nonton siaran langsung olahraga gratis kualitas HD di KusoTV.">
    <meta property="og:image" content="images/index.png">

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Config -->
    <script src="js/config.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 1. Header (Logo & Dark Themes Toggle) -->
        <header class="app-header">
            <div class="logo-container">
                <a href="/" class="logo-link" title="KusoTV Home">
                    <span class="logo-brand">Kuso<span class="logo-accent">TV</span></span>
                </a>
            </div>
            
            <div class="theme-toggle-wrapper" id="theme-toggle" title="Ganti Tema (Light / Dark)">
                <span class="theme-label">dark themes</span>
                <div class="toggle-switch">
                    <span class="toggle-thumb"></span>
                </div>
            </div>
        </header>

        <!-- 2. Video Player Section (16:9 Aspect Ratio) -->
        <section class="player-section" id="player-section">
            <div class="player-wrapper" id="player-wrapper">
                <!-- Video Placeholder Banner -->
                <div class="player-placeholder" id="player-placeholder" title="Klik untuk memutar siaran">
                    <img src="images/index.png" alt="KusoTV Live Sports" id="placeholder-img">
                    <div class="placeholder-overlay">
                        <div class="play-pulse-btn">
                            <i class="fas fa-play"></i>
                        </div>
                        <p class="placeholder-text">Klik salah satu pertandingan di bawah untuk menonton siaran</p>
                    </div>
                </div>

                <!-- Video Iframe Player -->
                <iframe 
                    id="video-iframe" 
                    src="about:blank" 
                    frameborder="0" 
                    allowfullscreen 
                    scrolling="no" 
                    allow="autoplay; encrypted-media; picture-in-picture"
                    style="display: none;"
                ></iframe>
            </div>

            <!-- Now Playing & Server Switch Bar -->
            <div class="now-playing-bar" id="now-playing-bar" style="display: none;">
                <div class="now-playing-info">
                    <span class="live-dot"></span>
                    <span class="playing-title" id="playing-title">Memutar Siaran Live</span>
                </div>
                <div class="server-chips" id="server-chips">
                    <!-- Dynamic server buttons inserted here -->
                </div>
            </div>
        </section>

        <!-- 3. Filter Navigation Tabs (Exact PDF Colors) -->
        <nav class="filter-tabs-nav" aria-label="Jadwal Navigasi">
            <div class="filter-tabs-left">
                <button class="filter-btn btn-tomorrow" data-tab="tomorrow">
                    Pertandingan besok
                </button>
                <button class="filter-btn btn-today active" data-tab="today">
                    Pertandingan hari ini
                </button>
                <button class="filter-btn btn-yesterday" data-tab="yesterday">
                    Pertandingan kemarin
                </button>
            </div>
            <div class="filter-tabs-right">
                <button class="filter-btn btn-all" data-tab="all">
                    Jadwal pertandingan
                </button>
            </div>
        </nav>

        <!-- 4. Match Fixtures List -->
        <main class="matches-container" id="matches-container">
            <div class="matches-loading">
                <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> Memuat jadwal pertandingan...
            </div>
        </main>
    </div>

    <!-- Application Controller -->
    <script src="js/app.js"></script>
</body>
</html>
